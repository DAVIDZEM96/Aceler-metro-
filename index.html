
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acelerómetro</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 12px}
button{background:#238636;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:16px;margin:4px 4px 4px 0}
button.sec{background:#30363d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.card{background:#161b22;border-radius:8px;padding:10px;text-align:center}
.card b{display:block;font-size:20px}
.card span{font-size:12px;color:#8b949e}
canvas{width:100%;height:220px;background:#161b22;border-radius:8px}
#msg{color:#f0883e;font-size:14px;min-height:18px}
</style>
</head>
<body>
<h1>Acelerómetro</h1>
<button id="ini">Iniciar</button>
<button id="rec" class="sec">Grabar</button>
<button id="csv" class="sec">Descargar CSV</button>
<div id="msg"></div>
<div class="grid">
  <div class="card"><b id="x">0.00</b><span>X (m/s²)</span></div>
  <div class="card"><b id="y">0.00</b><span>Y (m/s²)</span></div>
  <div class="card"><b id="z">0.00</b><span>Z (m/s²)</span></div>
  <div class="card"><b id="m">0.00</b><span>Magnitud</span></div>
  <div class="card"><b id="rms">0.00</b><span>RMS vibración</span></div>
  <div class="card"><b id="p">0.00</b><span>Pico</span></div>
</div>
<canvas id="c" width="700" height="220"></canvas>

<script>
const $ = id => document.getElementById(id);
const N = 300;
let buf = [], datos = [], activo = false, grabando = false, media = 9.81, hayDatos = false;

function set(id, v){ $(id).textContent = v.toFixed(2); }

function onMotion(e){
  const a = e.accelerationIncludingGravity;
  if(!a || a.x == null) return;
  hayDatos = true;
  const m = Math.hypot(a.x, a.y, a.z);
  media = media * 0.99 + m * 0.01;
  buf.push(m - media);
  if(buf.length > N) buf.shift();
  const rms = Math.sqrt(buf.reduce((s,v) => s + v*v, 0) / buf.length);
  const pico = Math.max(...buf.map(Math.abs));
  set('x', a.x); set('y', a.y); set('z', a.z);
  set('m', m); set('rms', rms); set('p', pico);
  if(grabando) datos.push([new Date().toISOString(), a.x, a.y, a.z, m].join(','));
  dibujar(pico);
}

function dibujar(pico){
  const c = $('c'), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  const esc = Math.max(2, pico), mid = c.height / 2;
  g.strokeStyle = '#30363d';
  g.beginPath(); g.moveTo(0, mid); g.lineTo(c.width, mid); g.stroke();
  g.strokeStyle = '#58a6ff'; g.lineWidth = 2;
  g.beginPath();
  buf.forEach((v, i) => {
    const px = i * c.width / N, py = mid - v / esc * (mid - 10);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  });
  g.stroke();
}

$('ini').onclick = async () => {
  if(activo){
    window.removeEventListener('devicemotion', onMotion);
    activo = false; $('ini').textContent = 'Iniciar'; return;
  }
  try{
    if(typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission){
      const r = await DeviceMotionEvent.requestPermission();
      if(r !== 'granted'){ $('msg').textContent = 'Permiso denegado.'; return; }
    }
    window.addEventListener('devicemotion', onMotion);
    activo = true; hayDatos = false; $('ini').textContent = 'Detener'; $('msg').textContent = '';
    setTimeout(() => {
      if(activo && !hayDatos) $('msg').textContent = 'No se detecta acelerómetro. Abre la página desde el celular con HTTPS.';
    }, 2000);
  }catch(err){ $('msg').textContent = 'Error: ' + err.message; }
};

$('rec').onclick = () => {
  grabando = !grabando;
  $('rec').textContent = grabando ? 'Detener grabación' : 'Grabar';
  $('rec').style.background = grabando ? '#da3633' : '';
};

$('csv').onclick = () => {
  if(!datos.length){ $('msg').textContent = 'No hay datos grabados.'; return; }
  const txt = 'tiempo,x,y,z,magnitud\n' + datos.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv'}));
  a.download = 'acelerometro.csv';
  a.click();
};
</script>
</body>
</html>
